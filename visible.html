<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f8">
  <title>Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #202333;
      --muted: #85899a;
      --accent: #6758e8;
      --accent-dark: #5849d2;
      --surface: #fff;
      --key: #f2f3f7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 15%, rgba(209, 202, 255, .45), transparent 32%),
        radial-gradient(ellipse at 88% 86%, rgba(255, 222, 208, .45), transparent 30%),
        #f4f5f8;
    }

    .calculator {
      width: min(100%, 390px);
      padding: 27px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .85);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(41, 43, 68, .12), 0 3px 10px rgba(41, 43, 68, .04);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 11px;
      font-size: 19px;
      box-shadow: 0 5px 12px rgba(103, 88, 232, .24);
    }

    .mode {
      padding: 7px 11px;
      color: var(--muted);
      background: #f6f6f9;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .display {
      min-height: 142px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 14px 3px 23px;
      text-align: right;
    }

    .previous {
      min-height: 24px;
      max-width: 100%;
      overflow: hidden;
      color: var(--muted);
      font-size: 15px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .current {
      width: 100%;
      overflow: hidden;
      font-size: clamp(42px, 13vw, 58px);
      font-weight: 500;
      letter-spacing: -.065em;
      line-height: 1.15;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 11px;
    }

    button {
      min-width: 0;
      height: 62px;
      border: 0;
      border-radius: 17px;
      color: var(--ink);
      background: var(--key);
      font: inherit;
      font-size: 20px;
      font-weight: 550;
      cursor: pointer;
      transition: transform .12s ease, background-color .12s ease, box-shadow .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: #e9eaf1;
    }

    button:active {
      transform: scale(.95);
    }

    button:focus-visible {
      outline: 3px solid rgba(103, 88, 232, .35);
      outline-offset: 2px;
    }

    button.utility {
      color: #5b5f70;
      background: #eceef4;
      font-size: 16px;
      font-weight: 650;
    }

    button.operator {
      color: var(--accent);
      background: #f0efff;
      font-size: 23px;
    }

    button.operator:hover {
      background: #e6e3ff;
    }

    button.equals {
      color: white;
      background: var(--accent);
      box-shadow: 0 7px 14px rgba(103, 88, 232, .2);
      font-size: 25px;
    }

    button.equals:hover {
      background: var(--accent-dark);
    }

    button.zero {
      grid-column: span 2;
      text-align: left;
      padding-left: 25px;
    }

    .hint {
      margin: 19px 0 0;
      color: #a0a3b0;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 380px) {
      .calculator {
        padding: 22px;
        border-radius: 24px;
      }

      .keys {
        gap: 9px;
      }

      button {
        height: 58px;
        border-radius: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">÷</span>
        <span>Calculator</span>
      </div>
      <span class="mode">Standard</span>
    </header>

    <section class="display" aria-label="Calculator display" aria-live="polite" aria-atomic="true">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="utility" type="button" data-action="clear" aria-label="All clear">AC</button>
      <button class="utility" type="button" data-action="sign" aria-label="Toggle sign">+/−</button>
      <button class="utility" type="button" data-action="percent" aria-label="Percent">%</button>
      <button class="operator" type="button" data-operator="/" aria-label="Divide">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button class="operator" type="button" data-operator="*" aria-label="Multiply">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button class="operator" type="button" data-operator="-" aria-label="Subtract">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button class="operator" type="button" data-operator="+" aria-label="Add">+</button>

      <button class="zero" type="button" data-digit="0">0</button>
      <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals" type="button" data-action="equals" aria-label="Equals">=</button>
    </section>
    <p class="hint">Use your keyboard or click the keys</p>
  </main>

  <script>
    const currentDisplay = document.querySelector("#current");
    const previousDisplay = document.querySelector("#previous");
    const keys = document.querySelector(".keys");

    let currentValue = "0";
    let storedValue = null;
    let pendingOperator = null;
    let shouldReplace = false;

    const symbols = { "/": "÷", "*": "×", "-": "−", "+": "+" };

    function render() {
      currentDisplay.textContent = currentValue;
      previousDisplay.textContent = storedValue !== null && pendingOperator
        ? `${storedValue} ${symbols[pendingOperator]}`
        : "";
    }

    function enterDigit(digit) {
      if (currentValue === "Error" || shouldReplace) {
        currentValue = digit;
        shouldReplace = false;
      } else if (currentValue === "0") {
        currentValue = digit;
      } else if (currentValue.replace("-", "").replace(".", "").length < 12) {
        currentValue += digit;
      }
      render();
    }

    function calculate(left, right, operator) {
      switch (operator) {
        case "+": return left + right;
        case "-": return left - right;
        case "*": return left * right;
        case "/": return right === 0 ? null : left / right;
        default: return right;
      }
    }

    function formatResult(value) {
      if (!Number.isFinite(value)) return "Error";
      return String(Number(value.toPrecision(10)));
    }

    function chooseOperator(operator) {
      if (currentValue === "Error") return;
      if (storedValue !== null && pendingOperator && shouldReplace) {
        pendingOperator = operator;
        render();
        return;
      }
      const input = Number(currentValue);
      if (storedValue !== null && pendingOperator && !shouldReplace) {
        const result = calculate(storedValue, input, pendingOperator);
        if (result === null) {
          currentValue = "Error";
          storedValue = null;
          pendingOperator = null;
          shouldReplace = true;
          render();
          return;
        }
        currentValue = formatResult(result);
      }
      storedValue = Number(currentValue);
      pendingOperator = operator;
      currentValue = "0";
      shouldReplace = true;
      render();
    }

    function equals() {
      if (storedValue === null || !pendingOperator || currentValue === "Error") return;
      const result = calculate(storedValue, Number(currentValue), pendingOperator);
      previousDisplay.textContent = `${storedValue} ${symbols[pendingOperator]} ${currentValue} =`;
      currentValue = result === null ? "Error" : formatResult(result);
      storedValue = null;
      pendingOperator = null;
      shouldReplace = true;
      currentDisplay.textContent = currentValue;
    }

    function handleAction(action) {
      if (action === "clear") {
        currentValue = "0";
        storedValue = null;
        pendingOperator = null;
        shouldReplace = false;
      } else if (action === "decimal") {
        if (currentValue === "Error" || shouldReplace) {
          currentValue = "0.";
          shouldReplace = false;
        } else if (!currentValue.includes(".")) {
          currentValue += ".";
        }
      } else if (action === "sign" && currentValue !== "Error" && Number(currentValue) !== 0) {
        currentValue = currentValue.startsWith("-") ? currentValue.slice(1) : `-${currentValue}`;
      } else if (action === "percent" && currentValue !== "Error") {
        currentValue = formatResult(Number(currentValue) / 100);
        shouldReplace = true;
      } else if (action === "equals") {
        equals();
        return;
      }
      render();
    }

    function backspace() {
      if (currentValue === "Error" || shouldReplace) {
        currentValue = "0";
        shouldReplace = false;
      } else {
        currentValue = currentValue.length > 1
          ? currentValue.slice(0, -1)
          : "0";
        if (currentValue === "-") currentValue = "0";
      }
      render();
    }

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      if (button.dataset.digit !== undefined) enterDigit(button.dataset.digit);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) enterDigit(event.key);
      else if (event.key === ".") handleAction("decimal");
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        equals();
      } else if (event.key === "Backspace") backspace();
      else if (event.key === "Escape") handleAction("clear");
      else if (event.key === "%") handleAction("percent");
    });
  </script>
</body>
</html>
